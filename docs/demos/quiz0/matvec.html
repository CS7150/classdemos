<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix times vector</title>
<meta name="description" content="A matrix-vector product as a weighted sum of columns, animated in algebra and geometry at once.">
<link rel="stylesheet" href="../demo.css">
<style>
#stagewrap{flex:1;min-height:0;display:flex;gap:10px;align-items:stretch}
#alg{position:relative;flex:0 0 430px;min-width:260px}
#geo{position:relative;flex:1 1 auto;min-width:280px}
#geo svg{position:absolute;inset:0;width:100%;height:100%}
.cel{position:absolute;left:0;top:0;width:44px;height:30px;display:flex;align-items:center;justify-content:center;
 font-size:17px;font-variant-numeric:tabular-nums;transform-origin:22px 15px;white-space:nowrap}
input.cel{border:1px solid transparent;border-radius:6px;background:transparent;text-align:center;
 font-family:inherit;padding:0;color:inherit}
input.cel:hover{border-color:var(--border);cursor:ns-resize}
input.cel:focus{outline:none;border-color:var(--blue);background:var(--surface)}
input.cel::-webkit-outer-spin-button,input.cel::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.cel[type=number]{-moz-appearance:textfield}
.op{position:absolute;left:0;top:0;font-size:20px;color:var(--text-muted);transform-origin:0 0}
.lbl{position:absolute;left:0;top:0;font-size:17px;font-style:italic;color:var(--text-secondary);transform-origin:0 0}
.brk{position:absolute;left:0;top:0;pointer-events:none;color:var(--border-strong);transform-origin:0 0}
.brk:before,.brk:after{content:"";position:absolute;top:0;bottom:0;width:7px;border:2px solid currentColor}
.brk:before{left:0;border-right:0;border-radius:3px 0 0 3px}
.brk:after{right:0;border-left:0;border-radius:0 3px 3px 0}
.phases{display:flex;gap:0;font-size:13.5px;color:var(--text-muted);margin-top:-2px}
.phases span{flex:1;text-align:center;padding:2px 0;border-top:2px solid var(--border)}
.phases span.on{color:var(--text-primary);border-top-color:var(--blue)}
.dim{font-size:15px;color:var(--text-secondary)}
select.sm{height:34px;padding:0 6px;font-size:15px}
@media (max-width:820px){#stagewrap{flex-direction:column}#alg{flex:0 0 190px}#geo{min-height:220px}}
</style>
</head>
<body>
<div class="nav"><a href="./">&larr; Quiz 0, worked</a> &middot; <a href="../../">CS7150 class demos</a></div>
<h1>Matrix &times; vector<span>: a weighted sum of the columns</span></h1>
<p class="quiz">Quiz 0, question 1(a). <b>Multiply by hand.</b> Edit any number, or change the shape, and press play.</p>

<div id="stagewrap">
  <div id="alg"><div id="algin"></div></div>
  <div id="geo">
    <svg viewBox="0 0 560 420" role="img" preserveAspectRatio="xMidYMid meet">
    <title>The columns of A as vectors, scaled and then added</title>
    <desc>The columns of A leave the origin together as a spray of arrows. Each is stretched by its entry of x at the same time as the others, and then all of them slide into a chain laid tip to tail whose end is Ax.</desc>
    <defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <g id="stage"></g>
    </svg>
  </div>
</div>

<div class="row">
<button class="main" id="play" onclick="toggle()">Play</button>
<span class="dim">shape</span>
<select class="sm" id="rows" onchange="setdim()"><option>1</option><option selected>2</option><option>3</option></select>
<span class="dim">&#215;</span>
<select class="sm" id="cols" onchange="setdim()"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
<button onclick="quiz()">Quiz values</button>
<button onclick="rnd()">Random</button>
<span id="orb" style="display:none;align-items:center;gap:8px"><span class="dim">turn</span>
<input type="range" id="az" min="-180" max="180" step="1" value="32" oninput="draw()" style="min-width:110px"></span>
</div>
<div class="row">
<span class="klab">build</span>
<input type="range" id="ts" min="0" max="400" step="1" value="0" oninput="setT(+this.value/100,1)">
<span class="knum" id="tv">0.00</span>
</div>
<div class="phases" id="ph">
 <span>split</span><span>transpose</span><span>scale</span><span>add</span></div>
<div class="rd" id="readout"></div>
<div class="cap" id="caption"></div>

<script>
var R=2,C=3,A=[[1,2,-1],[0,1,0]],X=[3,4,5];
var COL=['#378ADD','#BA7517','#7F77DD','#D85A30','#A0518F'];
var INK=['var(--blue-ink)','var(--warm-ink)','var(--violet-ink)','var(--orange-ink)','#8A3F7B'];
var SUB=['₁','₂','₃','₄','₅'];
var CW=44,CH=30,SG=40,GX=40;
var t=0,playing=false,raf=null,last=0;
var els={};

function cl(v){return Math.max(0,Math.min(1,v));}
function ease(f){return f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;}
function smooth(a,b,x){var u=cl((x-a)/(b-a));return u*u*(3-2*u);}
function lerp(a,b,f){return a+(b-a)*f;}
function fmt(v){var a=Math.abs(v),b=Math.abs(a-Math.round(a))<1e-9?String(Math.round(a)):a.toFixed(1);
 return (v<0?'−':'')+b;}
function par(v){return v<0?'('+fmt(v)+')':fmt(v);}
function colv(j){var v=[];for(var i=0;i<R;i++)v.push(A[i][j]);return v;}
function scaled(j){return colv(j).map(function(v){return v*X[j];});}
function partial(k){var p=new Array(R).fill(0);
 for(var j=0;j<k;j++)for(var i=0;i<R;i++)p[i]+=X[j]*A[i][j];return p;}
function result(){return partial(C);}

/* ---------- the algebra panel ---------- */
// Every cell is an absolutely positioned element whose transform is recomputed
// each frame from the timeline, so the matrix can split, hand a coefficient to
// each column and merge again without any of it being a separate picture.
function build(){
 var h='',i,j;
 h+='<div class="brk" id="bA"></div><div class="brk" id="bX"></div><div class="brk" id="bR"></div>';
 for(j=0;j<C;j++)h+='<div class="brk" id="bC'+j+'" style="color:'+COL[j%5]+'"></div>';
 h+='<div class="lbl" id="lA">A</div><div class="lbl" id="lX">x</div><div class="lbl" id="lR">Ax</div>';
 for(i=0;i<R;i++)for(j=0;j<C;j++)
  h+='<input class="cel" type="number" step="1" id="a'+i+'_'+j+'" style="color:'+INK[j%5]+
     '" aria-label="A row '+(i+1)+' column '+(j+1)+'">';
 for(j=0;j<C;j++)
  h+='<input class="cel" type="number" step="1" id="x'+j+'" style="color:'+INK[j%5]+
     '" aria-label="x entry '+(j+1)+'">';
 for(i=0;i<R;i++)h+='<div class="cel" id="r'+i+'" style="color:var(--green-ink);font-weight:500"></div>';
 for(j=0;j<C-1;j++)h+='<div class="op" id="p'+j+'">+</div>';
 document.getElementById('algin').innerHTML=h;
 els={};
 ['bA','bX','bR','lA','lX','lR'].forEach(function(k){els[k]=document.getElementById(k);});
 for(j=0;j<C;j++){els['bC'+j]=document.getElementById('bC'+j);els['x'+j]=document.getElementById('x'+j);
  if(j<C-1)els['p'+j]=document.getElementById('p'+j);}
 for(i=0;i<R;i++){els['r'+i]=document.getElementById('r'+i);
  for(j=0;j<C;j++)els['a'+i+'_'+j]=document.getElementById('a'+i+'_'+j);}
 for(i=0;i<R;i++)for(j=0;j<C;j++)hook(els['a'+i+'_'+j],i,j,1);
 for(j=0;j<C;j++){els['x'+j].value=X[j];hook(els['x'+j],0,j,0);}
}
// Typing works, and so does dragging a cell up and down.  Either way the timeline
// rewinds, because a half-scaled cell is not a number anyone meant to edit.
function hook(el,i,j,isA){
 function put(v){v=Math.max(-9,Math.min(9,Math.round(v)));
  if(isA)A[i][j]=v;else{X[j]=v;el.value=v;}
  t=0;pause();fitGeo();draw();}
 el.addEventListener('input',function(){var v=parseFloat(el.value);if(!isNaN(v))put(v);});
 el.addEventListener('pointerdown',function(e){
  var y0=e.clientY,v0=isA?A[i][j]:X[j],moved=false;
  el.setPointerCapture(e.pointerId);
  el.onpointermove=function(ev){var d=Math.round((y0-ev.clientY)/16);
   if(d)moved=true;if(moved)put(v0+d);};
  el.onpointerup=function(ev){el.onpointermove=null;el.onpointerup=null;
   try{el.releasePointerCapture(ev.pointerId);}catch(_){}};});
}
function place(el,x,y,op,sc){
 if(!el)return;
 el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)'+(sc!==1?' scale('+sc.toFixed(3)+')':'');
 el.style.opacity=op.toFixed(3);
 el.style.pointerEvents=op>0.5?'auto':'none';
}
function brk(el,x,y,w,h,op){
 if(!el)return;
 el.style.width=(w+14)+'px';el.style.height=(h+10)+'px';
 el.style.transform='translate('+(x-7).toFixed(1)+'px,'+(y-5).toFixed(1)+'px)';
 el.style.opacity=op.toFixed(3);
}
function layoutAlg(){
 // Beat 1 splits A into columns.  Beat 2 is three motions of x: it rises as a
 // block, turns a quarter turn into a row, and its entries fly out to sit over
 // their columns.  Beat 3 scales, beat 4 adds.
 var e1=ease(cl(t)),e2=cl(t-1),e3=ease(cl(t-2)),e4=ease(cl(t-3)),i,j;
 var sa=smooth(0,0.34,e2),sb=smooth(0.34,0.68,e2),sc=smooth(0.68,1,e2);
 var gap=SG*e1,cw=CW+gap,MX=((C-1)*cw)/2,AWs=(C-1)*cw+CW,BH=R*CH,fade=1-smooth(0.55,1,e4);
 function cx(j){return lerp(j*cw,MX,e4);}
 var XR=AWs+GX,xoff=(R*CH-C*CH)/2,
     rc=[XR+CW/2,xoff+C*CH/2],                 // x block centre, at rest
     st=[AWs/2,-(C*CH)/2-CH*0.6],              // clear of the matrix, even while turning
     cc=[lerp(rc[0],st[0],sb),lerp(rc[1],st[1],sa)], // straight up first, then across as it turns
     th=-Math.PI/2*sb,sn=Math.sin(th),cs=Math.cos(th);
 var right=lerp(XR+CW,cx(C-1)+CW,sa),
     box=document.getElementById('alg'),
     ox=Math.max(6,(box.clientWidth-right)/2),
     oy=Math.max(C*CH+CH*1.8,(box.clientHeight-BH)/2+6);
 // A, splitting into columns and then scaling
 var sw=e3<0.5?1-2*e3:2*e3-1;   // dip to nothing at the halfway point and come back as the product
 for(j=0;j<C;j++)for(i=0;i<R;i++){
  var v=e3<0.5?A[i][j]:A[i][j]*X[j],el=els['a'+i+'_'+j];
  if(document.activeElement!==el)el.value=v;
  place(el,ox+cx(j),oy+i*CH,fade*(e3>0&&e3<1?sw:1),1);}
 // x: rise, quarter turn, deal out
 for(j=0;j<C;j++){
  var y=(j-(C-1)/2)*CH,rx=cc[0]-y*sn-CW/2,ry=cc[1]+y*cs-CH/2,
      px=lerp(rx,cx(j),sc),py=lerp(ry,-CH*1.6,sc);
  place(els['x'+j],ox+px,oy+py+e3*CH*1.1,1-e3,lerp(1,0.55,e3));}
 // the running sum the columns are merging into
 var res=result();
 for(i=0;i<R;i++){els['r'+i].textContent=fmt(res[i]*e4);
  place(els['r'+i],ox+MX,oy+i*CH,smooth(0.3,0.9,e4),1);}
 for(j=0;j<C-1;j++)place(els['p'+j],ox+cx(j)+CW+gap/2-6,oy+BH/2-13,e1*fade*(gap>18?1:0),1);
 brk(els.bA,ox,oy,AWs,BH,1-smooth(0,0.35,e1));
 for(j=0;j<C;j++)brk(els['bC'+j],ox+cx(j),oy,CW,BH,smooth(0.25,0.8,e1)*fade);
 brk(els.bR,ox+MX,oy,CW,BH,smooth(0.3,0.9,e4));
 // the x bracket rides up with the block and turns with it, then lets go
 var bxw=CW+14,bxh=C*CH+10;
 els.bX.style.width=bxw+'px';els.bX.style.height=bxh+'px';
 els.bX.style.transformOrigin='50% 50%';
 els.bX.style.transform='translate('+(ox+cc[0]-bxw/2).toFixed(1)+'px,'+(oy+cc[1]-bxh/2).toFixed(1)+'px) rotate('+(th*180/Math.PI).toFixed(1)+'deg)';
 els.bX.style.opacity=(1-smooth(0.3,1,sb)).toFixed(3);
 place(els.lA,ox-30,oy+BH/2-12,1-smooth(0,0.35,e1),1);
 place(els.lX,ox+cc[0]-CW/2-27,oy+cc[1]-12,1-smooth(0,0.6,sb),1);
 place(els.lR,ox+MX+CW/2-11,oy+BH+16,smooth(0.3,0.9,e4),1);
}

/* ---------- the geometry panel ---------- */
var VW=560,VH=420,gb=null;
function pr(v){
 var a=[v[0]||0,v[1]||0,v[2]||0];
 if(R<=2)return [a[0],-a[1]];
 var az=+document.getElementById('az').value*Math.PI/180,el=22*Math.PI/180;
 return [a[0]*Math.cos(az)+a[1]*Math.sin(az),
        -(-a[0]*Math.sin(az)*Math.sin(el)+a[1]*Math.cos(az)*Math.sin(el)+a[2]*Math.cos(el))];
}
// Two fits, not one: close on the bare columns while they are all that is drawn,
// then widen to the whole journey over the stretch, so nothing is ever a speck
// and nothing ever jumps.
var gbA=null,gbB=null;
function fitOne(pts){
 var a=1e9,b=1e9,c=-1e9,d=-1e9,j;
 for(j=0;j<pts.length;j++){var r=pr(pts[j]);
  a=Math.min(a,r[0]);c=Math.max(c,r[0]);b=Math.min(b,r[1]);d=Math.max(d,r[1]);}
 var w=Math.max(c-a,1.7),h=Math.max(d-b,1.7),pad=54,
     s=Math.min((VW-2*pad)/w,(VH-2*pad)/h);
 return {s:s,ox:VW/2-s*(a+c)/2,oy:VH/2-s*(b+d)/2};
}
function fitGeo(){
 var near=[new Array(R).fill(0)],far=[new Array(R).fill(0)],i,j;
 for(j=0;j<C;j++){
  near.push(colv(j));
  far.push(colv(j));far.push(scaled(j));far.push(partial(j+1));
  var p=partial(j),sc=scaled(j),q=[];
  for(i=0;i<R;i++)q.push(p[i]+sc[i]);
  far.push(q);}
 gbA=fitOne(near);gbB=fitOne(far);
}
function gbNow(){var z=ease(cl((t-1.8)/1.1));
 return {s:lerp(gbA.s,gbB.s,z),ox:lerp(gbA.ox,gbB.ox,z),oy:lerp(gbA.oy,gbB.oy,z)};}
function M(v){var r=pr(v);return [gb.ox+gb.s*r[0],gb.oy+gb.s*r[1]];}
function TXT(x,y,s,c,anc,cls){return '<text class="'+(cls||'ts')+' gl" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+
 '" fill="'+c+'"'+(anc?' text-anchor="'+anc+'"':'')+'>'+s+'</text>';}
function ARR(p,q,c,w,op,dash){
 if(Math.hypot(q[0]-p[0],q[1]-p[1])<1.6)return '';
 return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+
  '" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+op.toFixed(2)+
  '"'+(dash?' stroke-dasharray="'+dash+'"':'')+' marker-end="url(#ar)"/>';}
function drawGeo(){
 var e1=ease(cl(t)),e3=ease(cl(t-2)),e4=ease(cl(t-3)),s='',i,j;
 gb=gbNow();
 var O=M(new Array(R).fill(0));
 if(R<=2){
  var lo=[Math.floor((0-gb.ox)/gb.s),Math.floor((0-gb.oy)/gb.s)],step=1,
      x0=Math.ceil((0-gb.ox)/gb.s),x1=Math.floor((VW-gb.ox)/gb.s),
      y0=Math.ceil((gb.oy-VH)/gb.s),y1=Math.floor(gb.oy/gb.s);
  if(x1-x0<70)for(i=x0;i<=x1;i++){var gx=gb.ox+gb.s*i;
   s+='<line x1="'+gx.toFixed(1)+'" y1="0" x2="'+gx.toFixed(1)+'" y2="'+VH+'" stroke="var(--border)" stroke-width="'+(i?0.6:1.3)+'" opacity="'+(i?0.5:1)+'"/>';}
  if(R===2&&y1-y0<70)for(i=y0;i<=y1;i++){var gy=gb.oy-gb.s*i;
   s+='<line x1="0" y1="'+gy.toFixed(1)+'" x2="'+VW+'" y2="'+gy.toFixed(1)+'" stroke="var(--border)" stroke-width="'+(i?0.6:1.3)+'" opacity="'+(i?0.5:1)+'"/>';}
 }else{
  // three axes, so the isometric view has something to read depth against
  var L=1.35*Math.max.apply(null,[1].concat(result().map(Math.abs)));
  for(j=0;j<3;j++){var e=[0,0,0];e[j]=L;var q=M(e);
   s+='<line x1="'+O[0].toFixed(1)+'" y1="'+O[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+
      '" stroke="var(--border-strong)" stroke-width="0.9" opacity="0.6"/>';}
 }
 // Every column at once: born at the origin, stretched in place, then carried
 // out to sit on the tip of the one before it.
 for(j=0;j<C;j++){
  var cv=colv(j),sv=scaled(j),p0=partial(j),
      f=lerp(1,X[j],e3),tail=[],head=[];
  for(i=0;i<R;i++){var tl=lerp(0,p0[i],e4);tail.push(tl);head.push(tl+cv[i]*f);}
  var Tp=M(tail),Hp=M(head);
  if(e3>0.02&&e4<0.98){var g=M(cv);
   s+=ARR(O,g,COL[j%5],1.6,0.3*(1-e4),'5 4');}
  s+=ARR(Tp,Hp,COL[j%5],3.2,lerp(0.35,1,e1));
  var mx=(Tp[0]+Hp[0])/2,my=(Tp[1]+Hp[1])/2,dx=Hp[0]-Tp[0],dy=Hp[1]-Tp[1],dl=Math.hypot(dx,dy);
  if(dl>26)s+=TXT(mx-dy/dl*15,my+dx/dl*15+5,(e3>0.5?par(X[j])+'·':'')+'a'+SUB[j%5],INK[j%5],'middle','tn');
 }
 if(e4>0.05){var rp=M(result());
  s+='<circle cx="'+rp[0].toFixed(1)+'" cy="'+rp[1].toFixed(1)+'" r="'+(6*e4).toFixed(1)+
     '" fill="var(--green)" stroke="var(--green-ink)" stroke-width="1.5" opacity="'+e4.toFixed(2)+'"/>';
  if(e4>0.6){var lp=M(partial(C-1)),dx=rp[0]-lp[0],dy=rp[1]-lp[1],dl=Math.hypot(dx,dy);
   if(dl<2){dx=0;dy=-1;dl=1;}
   s+=TXT(rp[0]+dx/dl*18,rp[1]+dy/dl*18+5,'Ax = ('+result().map(fmt).join(', ')+')','var(--green-ink)',dx<0?'end':'start');}}
 s+='<circle cx="'+O[0].toFixed(1)+'" cy="'+O[1].toFixed(1)+'" r="3" fill="var(--text-primary)"/>';
 return s;
}

/* ---------- frame ---------- */
function draw(){
 if(!gbA)fitGeo();
 layoutAlg();
 document.getElementById('stage').innerHTML=drawGeo();
 document.getElementById('tv').textContent=t.toFixed(2);
 document.getElementById('ts').value=Math.round(t*100);
 var k=Math.min(3,Math.floor(t));
 var sp=document.getElementById('ph').children;
 for(var i=0;i<4;i++)sp[i].classList.toggle('on',t>0&&i===k);
 readout();caption();
}
function readout(){
 var h,k=Math.floor(t),res=result();
 if(t<=0)h='<b>Ax is a weighted sum of the columns of A.</b> x has one entry per column, and that entry says how much of the column to take.';
 else if(t<1)h='A comes apart into its '+C+' columns. Each is a vector with '+R+' entr'+(R>1?'ies':'y')+', and the geometry shows all '+C+' of them leaving the origin at once.';
 else if(t<2)h='The vector x rises, turns a quarter turn into a row, and deals one entry to each column: x'+SUB[0]+' to the first, x'+SUB[1]+' to the second, and so on.';
 else if(t<3){var e=[];for(var j=0;j<C;j++)e.push(par(X[j])+'a'+SUB[j%5]);
  h='Every column is stretched by its own coefficient, all at the same time: '+e.join(', ')+'.';}
 else if(t<4)h='The stretched columns line up tip to tail. Where the last one ends is <b>Ax</b>.';
 else h='<b>Ax = ('+res.map(fmt).join(', ')+')</b>, reached by taking '+X.map(fmt).join(', ')+' of the '+C+' columns and adding them.';
 document.getElementById('readout').innerHTML=h;
}
function caption(){
 var res=result(),i,j,h='',tm=[];
 for(j=0;j<C;j++)tm.push('<span style="color:'+INK[j%5]+'">'+par(X[j])+'('+colv(j).map(fmt).join(', ')+')</span>');
 h+='<div><b>Column picture.</b> Ax = '+tm.join(' + ')+' = <b>('+res.map(fmt).join(', ')+')</b>. '+
  'Whatever A can produce is one of these weighted sums, so what A reaches is whatever its columns span.</div>';
 h+='<div style="margin-top:5px"><b>Row picture.</b> The same '+(R*C)+' products gathered by output entry instead, '+
  'each one a dot product of a row of A with x.</div>';
 for(i=0;i<R;i++){var e=[],tt=0;
  for(j=0;j<C;j++){e.push(par(A[i][j])+'·'+par(X[j]));tt+=A[i][j]*X[j];}
  h+='<div style="margin-left:18px">y'+SUB[i%5]+' = '+e.join(' + ')+' = <b>'+fmt(tt)+'</b></div>';}
 h+='<div class="ans" style="margin-top:6px">A is '+R+'&#215;'+C+' and x has '+C+' entries, so Ax has <b>'+R+'</b>. '+
  'The inner dimensions have to agree and they cancel: ('+R+'&#215;'+C+')('+C+'&#215;1) gives '+R+'&#215;1.</div>';
 document.getElementById('caption').innerHTML=h;
}

/* ---------- controls ---------- */
function setT(v,stop){t=Math.max(0,Math.min(4,v));if(stop)pause();draw();}
function step(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 if(playing){t+=dt*0.85;if(t>=4){t=4;pause();}}
 draw();
 raf=playing?requestAnimationFrame(step):null;
}
function pause(){playing=false;document.getElementById('play').textContent=t>=4?'Replay':'Play';
 if(raf){cancelAnimationFrame(raf);raf=null;}}
function toggle(){if(playing){pause();return;}
 if(t>=4)t=0;playing=true;document.getElementById('play').textContent='Pause';
 last=performance.now();raf=requestAnimationFrame(step);}
function setdim(){
 var nr=+document.getElementById('rows').value,nc=+document.getElementById('cols').value,i,j;
 var B=[];
 for(i=0;i<nr;i++){B.push([]);for(j=0;j<nc;j++)B[i].push(i<R&&j<C?A[i][j]:(i===j%nr?1:0));}
 var Y=[];for(j=0;j<nc;j++)Y.push(j<C?X[j]:2);
 R=nr;C=nc;A=B;X=Y;
 document.getElementById('orb').style.display=(R===3)?'flex':'none';
 reset();
}
function quiz(){R=2;C=3;A=[[1,2,-1],[0,1,0]];X=[3,4,5];
 document.getElementById('rows').value='2';document.getElementById('cols').value='3';
 document.getElementById('orb').style.display='none';reset();}
function rnd(){
 // small integers, no all-zero column, and at least one negative weight: a column
 // that walks backwards is the part people get wrong by hand
 var i,j;
 for(j=0;j<C;j++){var z=true;
  while(z){z=true;for(i=0;i<R;i++){A[i][j]=Math.floor(Math.random()*7)-3;if(A[i][j])z=false;}}
  X[j]=Math.floor(Math.random()*7)-3||2;}
 if(X.every(function(v){return v>0;}))X[Math.floor(Math.random()*C)]*=-1;
 reset();
}
function reset(){build();fitGeo();t=0;pause();draw();}
window.addEventListener('resize',function(){fitGeo();draw();});
if(window.ResizeObserver)new ResizeObserver(function(){draw();}).observe(document.getElementById('alg'));
document.addEventListener('keydown',function(e){
 if(e.target.tagName==='INPUT'&&e.target.type==='number')return;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}
 else if(e.key==='ArrowLeft')setT(t-0.1,1);
 else if(e.key==='ArrowRight')setT(t+0.1,1);
 else if(e.key==='n'||e.key==='N')rnd();
});
reset();
</script>
