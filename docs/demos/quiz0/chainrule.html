<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The chain rule</title>
<meta name="description" content="A nudge in w travelling down a chain, picking up a stretch factor at each link.">
<link rel="stylesheet" href="../demo.css">
<style>
.ts{font-size:20px}.tn{font-size:17px}
#wrap{position:relative;flex:0 0 auto;height:clamp(320px,58vh,760px)}
#wrap svg{position:absolute;inset:0;width:100%;height:100%}
.mini{width:54px;height:32px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;
 border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--text-primary);
 font-family:inherit;padding:0;cursor:ns-resize}
.mini:focus{outline:none;border-color:var(--blue)}
.mini::-webkit-outer-spin-button,.mini::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini[type=number]{-moz-appearance:textfield}
.eqn{font-size:16px;color:var(--text-secondary)}
.eqn b{color:var(--text-primary);font-weight:500}
</style>
</head>
<body>
<div class="nav"><a href="./">&larr; Quiz 0, worked</a> &middot; <a href="../../">CS7150 class demos</a></div>
<h1>The chain rule<span>: a nudge relayed down a graph</span></h1>
<p class="quiz">Quiz 0, question 3(a). <b>u = wx + b with x and b fixed, z = g(u). Write dz/dw.</b></p>

<div id="wrap">
<svg viewBox="0 0 1440 520" role="img" preserveAspectRatio="xMidYMid meet">
<title>A nudge in w passing through u and into z</title>
<desc>Three panels: u against w, whose slope is x; z against u, whose slope is g prime; and z against w, whose slope is their product. Underneath, the same computation as a graph: w and x into a multiply node, plus b into an add node, then g, then z, with the forward values written on the edges and the derivative of z with respect to each edge written beneath it, filled in from right to left by backpropagation.</desc>
<defs><clipPath id="c0"><rect x="20" y="34" width="450" height="216"/></clipPath><clipPath id="c1"><rect x="495" y="34" width="450" height="216"/></clipPath><clipPath id="c2"><rect x="970" y="34" width="450" height="216"/></clipPath><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g id="stage"></g>
</svg>
</div>

<div class="row">
<span class="klab">w</span>
<input type="range" id="ws" min="-200" max="200" step="1" value="80" oninput="draw()">
<span class="knum" id="wv">0.80</span>
<span class="klab">x</span>
<input type="range" id="xs" min="-300" max="300" step="25" value="200" oninput="draw()" style="max-width:180px">
<span class="knum" id="xv">2.00</span>
<button onclick="flipx()">flip x</button>
<span class="klab">b</span><input class="mini" type="number" id="bi" value="-1" step="0.5" min="-2" max="2" oninput="draw()">
<span class="klab">g</span>
<select id="gf" onchange="draw()">
 <option value="sig" selected>sigmoid</option><option value="tanh">tanh</option>
 <option value="relu">ReLU</option><option value="sq">square</option><option value="sin">sin</option></select>
</div>
<div class="row">
<button class="main" id="stepb" onclick="stepBack()">Step backward</button>
<button onclick="runAll()">Run all</button>
<button onclick="resetBP()">Reset</button>
<span class="klab" id="stepv">forward pass done; nothing propagated yet</span>
</div>
<div class="rd" id="readout"></div>
<div class="cap" id="caption"></div>

<script>
var W=0.8,H=0.35,X=2,B=-1,G='sig',anim=null,BP=0,bpanim=null;
var BLUE='#378ADD',WARM='#BA7517',PINK='#D4537E',GREEN='#1D9E75';
var P=[[20,34,470,250],[495,34,945,250],[970,34,1420,250]];

function g(u){
 if(G==='sig')return 1/(1+Math.exp(-u));
 if(G==='tanh')return Math.tanh(u);
 if(G==='relu')return Math.max(0,u);
 if(G==='sq')return u*u;
 return Math.sin(u);
}
function gp(u){
 if(G==='sig'){var s=g(u);return s*(1-s);}
 if(G==='tanh'){var t=Math.tanh(u);return 1-t*t;}
 if(G==='relu')return u>0?1:(u<0?0:NaN);
 if(G==='sq')return 2*u;
 return Math.cos(u);
}
function gname(){return {sig:'σ',tanh:'tanh',relu:'ReLU',sq:'u²',sin:'sin'}[G];}
function f2(v){return (Math.abs(v)<5e-5?0:v).toFixed(3).replace('-','\u2212');}
function f1(v){return (Math.abs(v)<5e-4?0:v).toFixed(2).replace('-','\u2212');}

/* ---------- plotting ---------- */
function mk(r,x0,x1,y0,y1){
 var sx=(r[2]-r[0])/(x1-x0),sy=(r[3]-r[1])/(y1-y0);
 return {X:function(v){return r[0]+(v-x0)*sx;},Y:function(v){return r[3]-(v-y0)*sy;},
         r:r,x0:x0,x1:x1,y0:y0,y1:y1};
}
function axes(m,xl,yl){
 var s='<rect x="'+m.r[0]+'" y="'+m.r[1]+'" width="'+(m.r[2]-m.r[0])+'" height="'+(m.r[3]-m.r[1])+
  '" fill="var(--surface)" opacity="0.5" stroke="var(--border)" stroke-width="1"/>';
 if(m.y0<0&&m.y1>0)s+='<line x1="'+m.r[0]+'" y1="'+m.Y(0).toFixed(1)+'" x2="'+m.r[2]+'" y2="'+m.Y(0).toFixed(1)+'" stroke="var(--border-strong)" stroke-width="0.8"/>';
 if(m.x0<0&&m.x1>0)s+='<line x1="'+m.X(0).toFixed(1)+'" y1="'+m.r[1]+'" x2="'+m.X(0).toFixed(1)+'" y2="'+m.r[3]+'" stroke="var(--border-strong)" stroke-width="0.8"/>';
 s+=TX(m.r[2]-4,m.r[3]-7,xl,'var(--text-muted)','end','tn');
 s+=TX(m.r[0]+5,m.r[1]+15,yl,'var(--text-muted)','start','tn');
 return s;
}
function curve(m,f,c,clip){
 var pts='',n=220;
 for(var i=0;i<=n;i++){var v=m.x0+(m.x1-m.x0)*i/n,y=f(v);
  if(!isFinite(y))continue;
  pts+=m.X(v).toFixed(1)+','+m.Y(y).toFixed(1)+' ';}
 return '<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2.4" clip-path="url(#'+clip+')"/>';
}
// Axes are fixed across every w and x, and come from the ranges the quantities
// can actually reach: u from the slider limits (|w| up to 2, |x| up to 3,
// |b| up to 2, so |u| up to 8), and z from g over that u range, padded.
var WMAX=2,XMAX=3,BMAX=2,UMAX=WMAX*XMAX+BMAX;
function zrange(){var lo=1e9,hi=-1e9;
 for(var i=0;i<=160;i++){var v=g(-UMAX+2*UMAX*i/160);if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);}}
 var pad=0.12*(hi-lo)+0.05;return [lo-pad,hi+pad];}
function TX(x,y,t,c,anc,cls){return '<text class="'+(cls||'ts')+' gl" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+
 '" fill="'+c+'"'+(anc?' text-anchor="'+anc+'"':'')+'>'+t+'</text>';}
function dot(x,y,c,r){return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(r||4.5)+'" fill="'+c+'" stroke="var(--bg)" stroke-width="1.2"/>';}
// the right triangle whose legs are the nudge going in and the change coming out
function nudge(m,a,b,fa,fb,c){
 var s='',x1=m.X(a),x2=m.X(b),y1=m.Y(fa),y2=m.Y(fb);
 s+='<polygon points="'+x1.toFixed(1)+','+y1.toFixed(1)+' '+x2.toFixed(1)+','+y1.toFixed(1)+' '+
    x2.toFixed(1)+','+y2.toFixed(1)+'" fill="'+c+'" fill-opacity="0.16"/>';
 s+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y1.toFixed(1)+
    '" stroke="'+c+'" stroke-width="2.2"/>';
 s+='<line x1="'+x2.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+
    '" stroke="'+c+'" stroke-width="2.2"/>';
 return s;
}
function glow(r){return '<rect x="'+(r[0]-5)+'" y="'+(r[1]-5)+'" width="'+(r[2]-r[0]+10)+'" height="'+(r[3]-r[1]+10)+'" rx="6" fill="none" stroke="var(--pink)" stroke-width="2.5" opacity="0.8"/>';}
function tangent(m,a,fa,sl,c){
 var d=(m.x1-m.x0)*0.6,p1=[a-d,fa-sl*d],p2=[a+d,fa+sl*d];
 return '<line x1="'+m.X(p1[0]).toFixed(1)+'" y1="'+m.Y(p1[1]).toFixed(1)+'" x2="'+m.X(p2[0]).toFixed(1)+
  '" y2="'+m.Y(p2[1]).toFixed(1)+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.85"/>';
}

function draw(){
 W=+document.getElementById('ws').value/100;
 X=+document.getElementById('xs').value/100;
 B=parseFloat(document.getElementById('bi').value);if(!isFinite(B))B=0;B=Math.max(-2,Math.min(2,B));
 G=document.getElementById('gf').value;
 document.getElementById('wv').textContent=W.toFixed(2);
 document.getElementById('xv').textContent=X.toFixed(2);

 var u=W*X+B,u2=(W+H)*X+B,z=g(u),z2=g(u2),
     du=u2-u,dz=z2-z,s='';

 // panel 1: u against w.  A straight line whose slope is x, on axes that never
 // move, so changing x visibly changes the slope.
 var wlo=-WMAX,whi=WMAX,mA=mk(P[0],wlo,whi,-UMAX,UMAX);
 if(BP===4)s+=glow(P[0]);
 s+=axes(mA,'w','u = wx + b');
 s+='<g clip-path="url(#c0)">';
 s+=curve(mA,function(v){return v*X+B;},BLUE,'c0');
 s+=tangent(mA,W,u,X,BLUE);
 s+=nudge(mA,W,W+H,u,u2,BLUE);
 s+=dot(mA.X(W),mA.Y(u),BLUE);
 s+=TX((mA.X(W)+mA.X(W+H))/2,mA.Y(u)+16,'&#916;w','var(--blue-ink)','middle','tn');
 s+=TX(mA.X(W+H)+7,(mA.Y(u)+mA.Y(u2))/2,'&#916;u','var(--blue-ink)','start','tn');
 s+='</g>';
 s+=TX((P[0][0]+P[0][2])/2,23,'slope here is x = '+f1(X),'var(--blue-ink)','middle','tn');

 // panel 2: z against u.  Its slope is g'(u), and that is the only place the
 // shape of g gets a say.  Same u range as the left plot's vertical axis.
 var zr=zrange(),mB=mk(P[1],-UMAX,UMAX,zr[0],zr[1]);
 if(BP===2)s+=glow(P[1]);
 s+=axes(mB,'u','z = '+gname()+'(u)');
 s+='<g clip-path="url(#c1)">';
 s+=curve(mB,g,WARM,'c1');
 s+=tangent(mB,u,z,gp(u),WARM);
 s+=nudge(mB,u,u2,z,z2,WARM);
 s+=dot(mB.X(u),mB.Y(z),WARM);
 s+=TX((mB.X(u)+mB.X(u2))/2,mB.Y(z)+16,'&#916;u','var(--warm-ink)','middle','tn');
 s+=TX(mB.X(u2)+7,(mB.Y(z)+mB.Y(z2))/2,'&#916;z','var(--warm-ink)','start','tn');
 s+='</g>';
 s+=TX((P[1][0]+P[1][2])/2,23,'slope here is '+gname()+'&#8242;(u) = '+f2(gp(u)),'var(--warm-ink)','middle','tn');

 // panel 3: the two links composed, on the left plot's w axis and the middle
 // plot's z axis
 var mC=mk(P[2],wlo,whi,zr[0],zr[1]);
 if(BP>=4)s+=glow(P[2]);
 s+=axes(mC,'w','z');
 s+='<g clip-path="url(#c2)">';
 s+=curve(mC,function(v){return g(v*X+B);},PINK,'c2');
 s+=tangent(mC,W,z,gp(u)*X,PINK);
 s+=nudge(mC,W,W+H,z,z2,PINK);
 s+=dot(mC.X(W),mC.Y(z),PINK);
 s+='</g>';
 s+=TX((P[2][0]+P[2][2])/2,23,'slope here is dz/dw = '+f2(gp(u)*X),'var(--pink-ink)','middle','tn');

 // The computation graph.  Values flow left to right along the top of each
 // edge; the derivative of z with respect to whatever is on that edge sits
 // underneath, filled in from the right as backpropagation reaches it, each
 // one the previous one times the local derivative of the node in between.
 s+=graph(u,z);
 document.getElementById('stage').innerHTML=s;
 readout(u,z,du,dz);caption(u,z,du,dz);
}
function box(x,y,lab,hot){return '<rect x="'+(x-27)+'" y="'+(y-20)+'" width="54" height="40" rx="8" fill="var(--surface)" stroke="'+(hot?'var(--pink)':'var(--border-strong)')+'" stroke-width="'+(hot?3:1.5)+'"/>'+
 TX(x,y+7,lab,'var(--text-primary)','middle');}
function edge(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--text-secondary)" stroke-width="1.6" marker-end="url(#ar)"/>';}
function graph(u,z){
 var s='',Y=384,gpu=gp(u),
     NX=[120,420,720,1020,1330],   // w, times, plus, g, z
     lit=function(k){return BP>=k;},
     GC='var(--pink-ink)',VC='var(--blue-ink)',MC='var(--text-muted)';
 s+=TX(720,300,'the same chain as a computation graph: values forward along the top of each edge, derivatives of z back along the bottom','var(--text-secondary)','middle','tn');
 // main line: w -> x -> + -> g -> z
 s+=TX(NX[0],Y+6,'w','var(--text-primary)','middle');
 s+=edge(NX[0]+18,Y,NX[1]-29,Y);
 s+=box(NX[1],Y,'&#215;',BP===4);
 s+=edge(NX[1]+27,Y,NX[2]-29,Y);
 s+=box(NX[2],Y,'+',BP===3);
 s+=edge(NX[2]+27,Y,NX[3]-29,Y);
 s+=box(NX[3],Y,gname(),BP===2);
 s+=edge(NX[3]+27,Y,NX[4]-16,Y);
 s+=TX(NX[4],Y+6,'z','var(--text-primary)','middle');
 // side inputs, from below left
 var XY=Y+86;
 s+=TX(NX[1]-100,XY+7,'x','var(--text-primary)','middle');
 s+=edge(NX[1]-86,XY-9,NX[1]-18,Y+22);
 s+=TX(NX[2]-100,XY+7,'b','var(--text-primary)','middle');
 s+=edge(NX[2]-86,XY-9,NX[2]-18,Y+22);
 // forward values, above the edges
 function fv(x,t){return TX(x,Y-14,t,VC,'middle','tn');}
 s+=fv((NX[0]+NX[1])/2,'w = '+f1(W));
 s+=fv((NX[1]+NX[2])/2,'wx = '+f2(W*X));
 s+=fv((NX[2]+NX[3])/2,'u = '+f2(u));
 s+=fv((NX[3]+NX[4])/2,'z = '+f2(z));
 s+=TX(NX[1]-114,XY+7,'x = '+f1(X),VC,'end','tn');
 s+=TX(NX[2]-114,XY+7,'b = '+f1(B),VC,'end','tn');
 // local derivatives, above each node: what that node alone contributes
 s+=TX(NX[1],Y-38,'&#8706;(wx)/&#8706;w = x','var(--text-muted)','middle','tn');
 s+=TX(NX[2],Y-38,'&#8706;u/&#8706;(wx) = 1','var(--text-muted)','middle','tn');
 s+=TX(NX[3],Y-38,gname()+'&#8242;(u) = '+f2(gpu),'var(--text-muted)','middle','tn');
 // gradients under the edges, lit from the right, each the one to its right
 // times the local derivative of the node between them
 function gv(x,k,t,t2){if(!lit(k))return TX(x,Y+22,'&#8706;z/&#8706;? &nbsp;&middot;&middot;&middot;',MC,'middle','tn');
  return TX(x,Y+22,t,GC,'middle','tn')+(t2?TX(x,Y+42,t2,GC,'middle','tn'):'');}
 s+=gv((NX[3]+NX[4])/2,1,'&#8706;z/&#8706;z = 1','start here');
 s+=gv((NX[2]+NX[3])/2,2,'&#8706;z/&#8706;u = '+f2(gpu),'= 1 &#215; '+gname()+'&#8242;(u)');
 s+=gv((NX[1]+NX[2])/2,3,'&#8706;z/&#8706;(wx) = '+f2(gpu),'= '+f2(gpu)+' &#215; 1');
 s+=gv((NX[0]+NX[1])/2,4,'&#8706;z/&#8706;w = '+f2(gpu*X),'= '+f2(gpu)+' &#215; '+f1(X));
 if(lit(4))s+=TX(NX[1]-114,XY+28,'&#8706;z/&#8706;x = '+f2(gpu*W),GC,'end','tn');
 if(lit(3))s+=TX(NX[2]-114,XY+28,'&#8706;z/&#8706;b = '+f2(gpu),GC,'end','tn');
 // the chain, read straight off the graph
 if(lit(4))s+=TX(NX[4]+16,Y+96,'dz/dw = '+gname()+'&#8242;(u) &#183; 1 &#183; x = <tspan font-weight="500">'+f2(gpu*X)+'</tspan>',GC,'end');
 else s+=TX(NX[4]+16,Y+96,'step backward to fill these in',MC,'end','tn');
 return s;
}
var STEPS=[
 'forward pass done: every edge has its value. Nothing has been propagated back yet.',
 'step 1, the seed: &#8706;z/&#8706;z = 1. The output&rsquo;s derivative with respect to itself is one; everything else is built from it.',
 'step 2, back through g: &#8706;z/&#8706;u = &#8706;z/&#8706;z &#215; g&#8242;(u). A node multiplies the gradient by its own local slope, which here is the slope of the middle plot.',
 'step 3, back through +: &#8706;z/&#8706;(wx) = &#8706;z/&#8706;u &#215; 1. Addition passes the gradient straight through, and b receives the same one.',
 'step 4, back through &#215;: &#8706;z/&#8706;w = &#8706;z/&#8706;(wx) &#215; x. Multiplication hands each input the gradient times the <i>other</i> input, so w gets a factor of x and x gets a factor of w. That factor of x is the slope of the left plot, and the product is the slope of the right one.'];
function stepBack(){if(BP<4){BP++;draw();}}
function runAll(){BP=4;draw();}
function resetBP(){BP=0;draw();}
function flipx(){var el=document.getElementById('xs');el.value=-el.value;draw();}
function readout(u,z,du,dz){
 var d=gp(u);
 document.getElementById('stepv').textContent=BP?'step '+BP+' of 4':'forward pass done; nothing propagated yet';
 document.getElementById('stepb').textContent=BP<4?'Step backward':'Done';
 document.getElementById('readout').innerHTML=
  'w = <b>'+f1(W)+'</b> &#183; x = <b>'+f1(X)+'</b> &#183; u = wx + b = <b>'+f2(u)+'</b> &#183; z = '+gname()+'(u) = <b>'+f2(z)+'</b>'+
  (BP>=4?' &#183; dz/dw = '+f2(d)+' &#215; '+f1(X)+' = <b>'+f2(d*X)+'</b>':'')+
  '<br>'+STEPS[BP];
}
function caption(u){
 var d=gp(u),h='';
 h+='<div class="ans"><b>The answer.</b> dz/dw = g&#8242;(u)&#183;x, with u = wx + b. '+
  'Here that is '+f2(d)+' &#215; '+f1(X)+' = <b>'+f2(d*X)+'</b>.</div>';
 h+='<div style="margin-top:6px"><b>Why it is a product.</b> A derivative is a stretch factor: how much '+
  'the output moves per unit of input, once the nudge is small enough that both curves look straight. '+
  'The nudge is stretched by x on the way into u, then by g&#8242;(u) on the way into z, so it comes out '+
  'stretched by both. Composing functions multiplies their stretch factors.</div>';
 h+='<div style="margin-top:6px"><b>Read it off the graph.</b> Going backward from z, the derivative on each edge is the derivative on the '+
  'edge to its right times the local derivative of the node in between: 1, then 1&#183;g&#8242;(u), then g&#8242;(u)&#183;1, then g&#8242;(u)&#183;x. '+
  'That is all backpropagation is: the chain rule, run right to left along a graph, one node at a time.</div>';
 h+='<div style="margin-top:6px"><b>Two things worth noticing.</b> The x is there because u = wx + b: the '+
  'same weight update is scaled by the input it multiplied. And dz/db = g&#8242;(u)&#183;1, so the bias gets the '+
  'same gradient without the x.</div>';
 if(G==='sig'&&Math.abs(u)>4)
  h+='<div style="margin-top:6px"><b>Where the gradient goes.</b> u = '+f2(u)+' is far out on the flat tail, '+
   'so &#963;&#8242;(u) = '+f2(d)+' and almost nothing gets through. Stack a few of these and the product of the '+
   'stretch factors dies: this is the vanishing gradient, visible in one link.</div>';
 if(G==='relu'&&Math.abs(u)<0.05)
  h+='<div style="margin-top:6px"><b>Careful here.</b> u is sitting at the kink, where ReLU has no derivative: '+
   'the stretch factor is 1 from the right and 0 from the left. Frameworks pick one and move on.</div>';
 document.getElementById('caption').innerHTML=h;
}
// drag the little b box as well as typing in it
['bi'].forEach(function(id){
 var el=document.getElementById(id);
 el.addEventListener('pointerdown',function(e){
  var y0=e.clientY,v0=parseFloat(el.value)||0,moved=false;
  el.setPointerCapture(e.pointerId);
  el.onpointermove=function(ev){var d=Math.round((y0-ev.clientY)/14)*0.5;
   if(d)moved=true;if(moved){el.value=(v0+d).toFixed(1).replace(/\.0$/,'');draw();}};
  el.onpointerup=function(ev){el.onpointermove=null;el.onpointerup=null;
   try{el.releasePointerCapture(ev.pointerId);}catch(_){}};});
});
document.addEventListener('keydown',function(e){
 if(e.target.tagName==='INPUT'&&e.target.type==='number')return;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();if(BP<4)stepBack();else resetBP();}
 else if(e.key==='f'||e.key==='F')flipx();
 else if(e.key==='r'||e.key==='R')resetBP();
});
draw();
</script>
</body>
</html>
